plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
    id 'com.github.johnrengelman.shadow' version '7.1.2'  // 加入shadow插件
}

group = 'org.windy'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.18.2-R0.1-SNAPSHOT'
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.named('runServer') {
    minecraftVersion = '1.18'
}

def targetJavaVersion = 17

java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < JavaVersion.toVersion(targetJavaVersion)) {
        toolchain {
            languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    inputs.properties version: version
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand version: version
    }
}

// Shadow插件配置
shadowJar {
    archiveClassifier.set('') // 取消默认的 -all 后缀，方便直接用
    // 避免依赖冲突，给Adventure包做重定位（可选）
    relocate 'net.kyori.adventure', 'org.windy.shaded.net.kyori.adventure'
}

// 让 build 任务依赖 shadowJar，方便一键打包
build.dependsOn shadowJar
